name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: check out
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: format
        run: cargo fmt --all -- --check

      - name: no-std check
        run: cargo check --locked --no-default-features
        env:
          RUSTFLAGS: -C panic=abort

      - name: examples
        run: cargo check --locked --examples

      - name: tokio compatibility
        run: cargo check --locked --features tokio-compat

      - name: all features
        run: cargo check --locked --all-features

      - name: tests
        run: cargo test --locked

      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
