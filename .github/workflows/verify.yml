name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Only the newest commit on a branch can provide current evidence. This
  # prevents a stalled older main run from blocking validation of a fix.
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: record Linux provenance
        run: |
          {
            echo "source_commit=$GITHUB_SHA"
            rustc -vV
            cargo -vV
            uname -a
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "source_tree_sha256=$(git ls-files -z | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
            echo "fuzz_corpus_files=$(find fuzz/corpus/query_view -type f | wc -l)"
            echo "fuzz_corpus_sha256=$(find fuzz/corpus/query_view -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          } > linux-provenance.txt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo check --locked --all-targets
      - run: cargo check --locked --features doq --all-targets
      - run: RUSTFLAGS='-C panic=abort' cargo check --locked --no-default-features
      - run: cargo check --locked --examples
      # A fresh hosted runner may still compile the default binary here after
      # the feature-matrix checks; retain a hard bound without treating that
      # cold build as an executable hang.
      - run: timeout 300s cargo run --locked -- --check blackhole.example.toml
      - run: timeout 300s cargo run --locked -- --check blackhole.lan.example.toml
      - run: cargo test --locked --all-targets
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --locked --workspace
      - run: cargo test --locked --test resolver_fixture -- --nocapture
      - run: cargo test --locked --features perf-instrument --test resolver_fixture listener_forwards_allowed_query_to_loopback_upstream -- --nocapture
      - run: cargo test --locked --test resolver_fixture listener_retries_a_truncated_upstream_reply_over_tcp -- --nocapture
      - run: cargo test --locked --doc
      - run: cargo build --locked --no-default-features --target thumbv7m-none-eabi
      - run: cargo check --locked --features tokio-compat --all-targets
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock
      - name: validate deployment scripts
        run: |
          sh -n deploy/systemd/install.sh
          sh -n deploy/systemd/smoke.sh
          sh -n deploy/launchd/install.sh
          sh -n deploy/package/build.sh
          sh -n deploy/package/build-deb.sh
          sh -n deploy/package/smoke-deb.sh
          sh -n deploy/package/smoke-archive.sh
      - name: build release packages
        run: |
          timeout --signal=TERM --kill-after=30s 12m \
            cargo build --locked --release --features std --bin blackhole
          mkdir -p dist
          deploy/package/build.sh target/release/blackhole dist
          BLACKHOLE_DEB_VERSION=0.0.9 deploy/package/build-deb.sh target/release/blackhole dist
          deploy/package/build-deb.sh target/release/blackhole dist
          package_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$package_version"
          tar -tzf dist/blackhole-*.tar.gz >/dev/null
          new_package=$(find dist -name "blackhole_${package_version}_*.deb" -print -quit)
          test -n "$new_package"
          ar t "$new_package"
          mkdir -p package-check/control package-check/data
          ar p "$new_package" control.tar.gz | tar -xzf - -C package-check/control
          ar p "$new_package" data.tar.gz | tar -xzf - -C package-check/data
          test -x package-check/control/postinst
          test -x package-check/control/prerm
          test -f package-check/control/conffiles
          grep -Fx '/etc/blackhole/blackhole.toml' package-check/control/conffiles
          test -x package-check/data/usr/local/bin/blackhole
          test -f package-check/data/etc/blackhole/blackhole.toml
          test -f package-check/data/etc/systemd/system/blackhole.service
          sh -n package-check/control/postinst package-check/control/prerm
          {
            echo "source_commit=$GITHUB_SHA"
            rustc -vV
            cargo -vV
            uname -a
            sha256sum Cargo.lock
            echo "fuzz_corpus_files=$(find fuzz/corpus/query_view -type f | wc -l)"
            find fuzz/corpus/query_view -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum
          } > dist/verification-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: blackhole-linux-packages-${{ github.sha }}
          path: dist/
      - name: build capture smoke
        run: cargo build --locked --example capture_smoke
      - name: record Linux privileged smoke capabilities
        # Capability discovery is diagnostic evidence. A runner without the
        # required sudo/nft/systemd surface must not suppress portable gates.
        continue-on-error: true
        run: |
          {
            echo "runner=$(uname -a)"
            sudo -n id || true
            sudo -n systemctl --version | head -n 1 || true
            sudo -n nft --version || true
            echo 'nft_nat_redirect_check:'
            sudo -n nft -c -f - <<'EOF' || true
            table inet blackhole_capability_probe {
              chain capture {
                type nat hook prerouting priority dstnat; policy accept;
                tcp dport 53 redirect to :5353
              }
            }
            EOF
            sudo -n systemctl is-system-running || true
          } 2>&1 | tee systemd-capabilities.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-linux-capabilities-${{ github.sha }}
          path: |
            systemd-capabilities.log
            linux-provenance.txt
      - name: run systemd install and rollback smoke
        id: systemd-smoke
        # The smoke is disposable host evidence. Hosted runners may expose a
        # partial systemd manager even when the rooted fixture cannot verify
        # every distro unit dependency; retain the log without suppressing
        # portable/package gates.
        continue-on-error: true
        run: |
          systemd_state=$(sudo -n systemctl is-system-running 2>/dev/null || true)
          case "$systemd_state" in
            running|degraded|maintenance)
            set -o pipefail
            sudo -n env BLACKHOLE_SMOKE_TRACE=1 \
              BLACKHOLE_BINARY="$PWD/target/release/blackhole" \
              BLACKHOLE_CONFIG="$PWD/blackhole.example.toml" \
              deploy/systemd/smoke.sh 2>&1 | tee systemd-smoke.log
              ;;
            *)
              echo "systemd host smoke unavailable: manager state is ${systemd_state:-unknown}" | tee systemd-smoke.log
              ;;
          esac
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-linux-smoke-${{ github.sha }}
          path: |
            systemd-smoke.log
            linux-provenance.txt
      - name: report systemd smoke failure
        if: ${{ always() && steps.systemd-smoke.outcome == 'failure' }}
        run: |
          while IFS= read -r line; do
            escaped=${line//'%'/'%25'}
            escaped=${escaped//$'\r'/'%0D'}
            escaped=${escaped//$'\n'/'%0A'}
            echo "::error title=systemd smoke::$escaped"
          done < <(tail -n 80 systemd-smoke.log)
      - name: probe Debian package smoke capability
        id: debian-capability
        run: |
          if sudo -n env PATH="$PATH" sh -c 'test "$(id -u)" = 0 && command -v dpkg >/dev/null && command -v dpkg-deb >/dev/null'; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Debian package install smoke unavailable: privileged runner lacks root dpkg/dpkg-deb'
          fi
      - name: run Debian package install smoke
        id: debian-smoke
        if: steps.debian-capability.outputs.available == 'true'
        run: |
          package_version=$(sed -n 's/^version = "\([^\"]*\)"/\1/p' Cargo.toml | head -n 1)
          old_package=$(find dist -name 'blackhole_0.0.9_*.deb' -print -quit)
          new_package=$(find dist -name "blackhole_${package_version}_*.deb" -print -quit)
          test -n "$old_package" && test -n "$new_package"
          set -o pipefail
          sudo -n env PATH="$PATH" sh -c \
            'cd "$1" && BLACKHOLE_SMOKE_TRACE=1 deploy/package/smoke-deb.sh "$2" "$3"' \
            sh "$PWD" "$PWD/$old_package" "$PWD/$new_package" \
            2>&1 | tee debian-smoke.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-debian-smoke-${{ github.sha }}
          path: |
            debian-smoke.log
            linux-provenance.txt
      - name: report Debian package smoke failure
        if: ${{ always() && steps.debian-smoke.outcome == 'failure' }}
        run: |
          while IFS= read -r line; do
            escaped=${line//'%'/'%25'}
            escaped=${escaped//$'\r'/'%0D'}
            escaped=${escaped//$'\n'/'%0A'}
            echo "::error title=Debian package smoke::$escaped"
          done < <(tail -n 100 debian-smoke.log)
      - name: run archive installer smoke
        run: sudo -n deploy/package/smoke-archive.sh "$(find dist -name 'blackhole-*.tar.gz' -print -quit)"
      - name: run privileged capture smoke
        # The exact capability probe above decides whether this executes; a
        # host can still revoke the capability between probe and smoke.
        continue-on-error: true
        run: |
          if sudo -n nft list tables >/dev/null 2>&1 \
            && sudo -n nft -c -f /dev/stdin <<'EOF'
          table inet blackhole_capability_probe {
            chain capture {
              type nat hook prerouting priority dstnat; policy accept;
              tcp dport 53 redirect to :5353
            }
          }
          EOF
          then
            sudo -n target/debug/examples/capture_smoke
          else
            echo 'nftables capture smoke unavailable: runner lacks NAT redirect capability'
          fi

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: validate deployment scripts
        run: |
          sh -n deploy/systemd/install.sh
          sh -n deploy/launchd/install.sh
          sh -n deploy/package/build.sh
          sh -n deploy/package/build-deb.sh
          sh -n deploy/package/smoke-deb.sh
          sh -n deploy/package/smoke-archive.sh
      - name: validate launchd service
        run: plutil -lint deploy/launchd/com.brianbruggeman.blackhole.plist
      - name: record macOS toolchain
        run: |
          {
            echo "source_commit=$GITHUB_SHA"
            uname -a
            xcodebuild -version
            rustc -vV
            cargo -vV
            cc --version
            shasum -a 256 Cargo.lock
            echo "fuzz_corpus_files=$(find fuzz/corpus/query_view -type f | wc -l)"
            find fuzz/corpus/query_view -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256
          } > macos-toolchain.txt 2>&1
      - name: check all targets
        id: macos-check
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --locked --all-targets 2>&1 | tee macos-cargo-check.log
      - name: test library
        if: always()
        run: cargo test --lib
      - name: test loopback resolver fixture
        if: always()
        run: cargo test --test resolver_fixture -- --nocapture
      - name: build capture smoke
        if: always()
        run: cargo build --locked --example capture_smoke
      - name: record macOS privileged smoke capabilities
        if: always()
        run: |
          {
            echo "runner=$(sw_vers -productVersion) $(uname -a)"
            sudo -n id
            launchctl version
            sudo -n pfctl -s info || true
            sudo -n launchctl print system/com.brianbruggeman.blackhole || true
          } 2>&1 | tee launchd-capabilities.log
      - name: run privileged capture smoke
        # PF availability is runner-dependent; retain the failure in the
        # uploaded diagnostics without failing portable macOS validation.
        continue-on-error: true
        if: always()
        run: |
          if sudo -n pfctl -s info >/dev/null 2>&1 && sudo -n pfctl -E >/dev/null 2>&1; then
            sudo -n target/debug/examples/capture_smoke
          else
            echo 'PF capture smoke unavailable: runner does not expose privileged PF'
          fi
      - name: build launchd release binary
        if: always()
        run: cargo build --locked --release --bin blackhole
      - name: run launchd host install and upgrade smoke
        id: launchd-smoke
        # Hosted macOS runners do not consistently expose a usable launchd
        # system context; preserve the diagnostic result and continue.
        continue-on-error: true
        if: always()
        timeout-minutes: 2
        run: |
          if sudo -n launchctl print system >/dev/null 2>&1 \
            && command -v sysadminctl >/dev/null 2>&1; then
            set -o pipefail
            sudo -n env BLACKHOLE_SMOKE_TRACE=1 \
              BLACKHOLE_BINARY="$PWD/target/release/blackhole" \
              BLACKHOLE_CONFIG="$PWD/blackhole.example.toml" \
              BLACKHOLE_PLIST="$PWD/deploy/launchd/com.brianbruggeman.blackhole.plist" \
              deploy/launchd/smoke.sh 2>&1 | tee launchd-smoke.log
          else
            echo 'launchd host smoke unavailable: runner lacks a usable launchd/system context' | tee launchd-smoke.log
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-macos-diagnostics-${{ github.sha }}
          path: |
            macos-toolchain.txt
            macos-cargo-check.log
            launchd-capabilities.log
            launchd-smoke.log
      - name: report launchd smoke failure
        if: ${{ always() && steps.launchd-smoke.outcome == 'failure' }}
        run: |
          while IFS= read -r line; do
            escaped=${line//'%'/'%25'}
            escaped=${escaped//$'\r'/'%0D'}
            escaped=${escaped//$'\n'/'%0A'}
            echo "::error title=launchd smoke::$escaped"
          done < <(tail -n 80 launchd-smoke.log)
      - name: fail if macOS check failed
        if: steps.macos-check.outcome == 'failure'
        run: |
          while IFS= read -r line; do
            escaped=${line//'%'/'%25'}
            escaped=${escaped//$'\r'/'%0D'}
            escaped=${escaped//$'\n'/'%0A'}
            echo "::error title=macOS cargo check::$escaped"
          done < <(grep -Ei 'error|failed|caused by|could not|unsupported|timeout' macos-cargo-check.log | tail -n 40)
          exit 1

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --no-default-features --target wasm32-unknown-unknown --lib
      - run: node scripts/wasm_edge_bench.mjs target/wasm32-unknown-unknown/debug/blackhole.wasm | tee wasm-node.txt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-read scripts/wasm_edge_bench.mjs target/wasm32-unknown-unknown/debug/blackhole.wasm | tee wasm-deno.txt
      - run: cargo check --locked --examples
      - name: record WASM provenance
        run: |
          {
            echo "source_commit=$GITHUB_SHA"
            rustc -vV
            cargo -vV
            uname -a
            node --version
            deno --version
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "source_tree_sha256=$(git ls-files -z | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
            echo "fuzz_corpus_files=$(find fuzz/corpus/query_view -type f | wc -l)"
            echo "fuzz_corpus_sha256=$(find fuzz/corpus/query_view -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
            stat -c "artifact_bytes=%s artifact=%n" target/wasm32-unknown-unknown/debug/blackhole.wasm
          } > wasm-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: blackhole-wasm-gate-${{ github.sha }}
          path: |
            wasm-metadata.txt
            wasm-node.txt
            wasm-deno.txt

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: fuzz query boundary
        id: fuzz-run
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 300s cargo +nightly fuzz run query_view -- -runs=1000 2>&1 | tee fuzz-gate.txt
      - name: record fuzz provenance
        if: always()
        run: |
          {
            echo "source_commit=$GITHUB_SHA"
            rustc +nightly -vV
            echo "cargo_lock_sha256=$(sha256sum fuzz/Cargo.lock | awk '{print $1}')"
            echo "source_tree_sha256=$(git ls-files -z | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
            echo "fuzz_corpus_files=$(find fuzz/corpus/query_view -type f | wc -l)"
            echo "fuzz_corpus_sha256=$(find fuzz/corpus/query_view -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          } > fuzz-metadata.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-fuzz-gate-${{ github.sha }}
          path: |
            fuzz-gate.txt
            fuzz-metadata.txt
      - name: fail if fuzz failed
        if: steps.fuzz-run.outcome == 'failure'
        run: exit 1

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          BLACKHOLE_SOURCE_COMMIT: ${{ github.sha }}
        run: cargo run --release --locked --example performance_gate --features perf-instrument > performance-gate.txt
      - name: run real listener boundary gate
        env:
          BLACKHOLE_SOURCE_COMMIT: ${{ github.sha }}
        run: cargo run --release --locked --features perf-instrument --example listener_performance > listener-performance-gate.txt
      - name: record performance provenance
        run: |
          {
            echo "source_commit=$GITHUB_SHA"
            rustc -vV
            uname -a
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')"
            echo "source_tree_sha256=$(git ls-files -z | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
            echo "fuzz_corpus_files=$(find fuzz/corpus/query_view -type f | wc -l)"
            echo "fuzz_corpus_sha256=$(find fuzz/corpus/query_view -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          } > performance-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: blackhole-performance-gate-${{ github.sha }}
          path: |
            performance-gate.txt
            listener-performance-gate.txt
            performance-metadata.txt
