name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo check --features doq --all-targets
      - run: cargo test --all-targets
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace
      - run: cargo test --test resolver_fixture -- --nocapture
      - run: cargo test --features perf-instrument --test resolver_fixture listener_forwards_allowed_query_to_loopback_upstream -- --nocapture
      - run: cargo test --test resolver_fixture listener_retries_a_truncated_upstream_reply_over_tcp -- --nocapture
      - run: cargo test --doc
      - run: cargo build --no-default-features --target thumbv7m-none-eabi
      - run: cargo check --features tokio-compat --all-targets
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock
      - name: validate deployment scripts
        run: |
          sh -n deploy/systemd/install.sh
          sh -n deploy/launchd/install.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: validate deployment scripts
        run: |
          sh -n deploy/systemd/install.sh
          sh -n deploy/launchd/install.sh
      - name: validate launchd service
        run: plutil -lint deploy/launchd/com.brianbruggeman.blackhole.plist
      - name: record macOS toolchain
        run: |
          {
            echo "source_commit=$GITHUB_SHA"
            uname -a
            xcodebuild -version
            rustc -vV
            cargo -vV
            cc --version
          } > macos-toolchain.txt 2>&1
      - name: check all targets
        id: macos-check
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --locked --all-targets 2>&1 | tee macos-cargo-check.log
      - name: test library
        if: always()
        run: cargo test --lib
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-macos-diagnostics-${{ github.sha }}
          path: |
            macos-toolchain.txt
            macos-cargo-check.log
      - name: fail if macOS check failed
        if: steps.macos-check.outcome == 'failure'
        run: |
          while IFS= read -r line; do
            escaped=${line//'%'/'%25'}
            escaped=${escaped//$'\r'/'%0D'}
            escaped=${escaped//$'\n'/'%0A'}
            echo "::error title=macOS cargo check::$escaped"
          done < <(grep -Ei 'error|failed|caused by|could not|unsupported|timeout' macos-cargo-check.log | tail -n 40)
          exit 1

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --no-default-features --target wasm32-unknown-unknown --lib
      - run: node scripts/wasm_edge_bench.mjs target/wasm32-unknown-unknown/debug/blackhole.wasm
      - run: cargo check --examples
      - name: record WASM provenance
        run: |
          {
            echo "source_commit=$GITHUB_SHA"
            rustc -vV
            cargo -vV
            uname -a
            node --version
            sha256sum Cargo.lock
            stat -c "artifact_bytes=%s artifact=%n" target/wasm32-unknown-unknown/debug/blackhole.wasm
          } > wasm-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: blackhole-wasm-gate-${{ github.sha }}
          path: wasm-metadata.txt

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: fuzz query boundary
        id: fuzz-run
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 120s cargo +nightly fuzz run query_view -- -runs=1000 2>&1 | tee fuzz-gate.txt
      - name: record fuzz provenance
        if: always()
        run: |
          {
            echo "source_commit=$GITHUB_SHA"
            rustc +nightly -vV
            echo "corpus_files=$(find fuzz/corpus/query_view -type f | wc -l)"
            sha256sum fuzz/Cargo.lock
          } > fuzz-metadata.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-fuzz-gate-${{ github.sha }}
          path: |
            fuzz-gate.txt
            fuzz-metadata.txt
      - name: fail if fuzz failed
        if: steps.fuzz-run.outcome == 'failure'
        run: exit 1

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          BLACKHOLE_SOURCE_COMMIT: ${{ github.sha }}
        run: cargo run --release --example performance_gate --features perf-instrument > performance-gate.txt
      - name: record performance provenance
        run: |
          {
            echo "source_commit=$GITHUB_SHA"
            rustc -vV
            uname -a
            sha256sum Cargo.lock
          } > performance-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: blackhole-performance-gate-${{ github.sha }}
          path: |
            performance-gate.txt
            performance-metadata.txt
