name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo check --features doq --all-targets
      - run: cargo test --all-targets
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace
      - run: cargo test --test resolver_fixture -- --nocapture
      - run: cargo test --features perf-instrument --test resolver_fixture listener_forwards_allowed_query_to_loopback_upstream -- --nocapture
      - run: cargo test --test resolver_fixture listener_retries_a_truncated_upstream_reply_over_tcp -- --nocapture
      - run: cargo test --doc
      - run: cargo build --no-default-features --target thumbv7m-none-eabi
      - run: cargo check --features tokio-compat --all-targets
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: record macOS toolchain
        run: |
          {
            uname -a
            xcodebuild -version
            rustc -vV
            cargo -vV
            cc --version
          } > macos-toolchain.txt 2>&1
      - name: check all targets
        run: |
          set -o pipefail
          cargo check --all-targets 2>&1 | tee macos-cargo-check.log
      - run: cargo test --lib
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-macos-diagnostics-${{ github.sha }}
          path: |
            macos-toolchain.txt
            macos-cargo-check.log

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --no-default-features --target wasm32-unknown-unknown
      - run: cargo check --examples

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: timeout 120s cargo +nightly fuzz run query_view -- -runs=1000

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          BLACKHOLE_SOURCE_COMMIT: ${{ github.sha }}
        run: cargo run --release --example performance_gate --features perf-instrument > performance-gate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: blackhole-performance-gate-${{ github.sha }}
          path: performance-gate.txt
