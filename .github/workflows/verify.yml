name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo test --all-targets
      - run: cargo test --test resolver_fixture -- --nocapture
      - run: cargo test --doc
      - run: cargo check --no-default-features --target thumbv7m-none-eabi
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo test --lib

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --no-default-features --target wasm32-unknown-unknown
      - run: cargo check --examples

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: timeout 120s cargo +nightly fuzz run query_view -- -runs=1000

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          BLACKHOLE_SOURCE_COMMIT: ${{ github.sha }}
        run: cargo run --release --example performance_gate > performance-gate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: blackhole-performance-gate-${{ github.sha }}
          path: performance-gate.txt
