[server]
# Use 53 only with the required OS capability; loopback keeps local testing scoped.
listen = "127.0.0.1:5353"

[capture]
# Capture is opt-in. Enabling it requires the platform's firewall capability.
enabled = false
inbound_port = 53
chain = "capture"
mark = 42
# The parent directory must already be owned and writable by the service.
ownership_path = "/var/lib/blackhole/capture.state"
# Used by the macOS PF adapter; set this to the host's inbound DNS address.
original_destination = "127.0.0.1:53"

[policy]
# ignore drops the DNS response, nxdomain denies it, honeypot returns the configured address.
mode = "nxdomain"
domains = ["ads.example", "telemetry.example"]
# With explicit rules, unmatched queries use this action. Set to "forward"
# for a resolver deployment with the [upstream] section below.
default_action = "pass"

# Optional Pi-hole-compatible hosts/domain lists. Every entry becomes a
# bounded, generated NXDOMAIN rule; missing or malformed files fail startup.
blocklists = []

[upstream]
# IP literal only; no hostname lookup is performed.
resolver_ip = "1.1.1.1"
port = 53
query_timeout_ms = 2000
max_attempts = 2
max_outstanding = 64
# Open the upstream circuit after this many consecutive failures.
breaker_failures = 3
# Keep the circuit open for this long before allowing a probe.
breaker_cooldown_secs = 30

[cache]
# Bound memory used by positive and negative upstream answers.
max_entries = 1024
# Permit cached answers to serve during a bounded upstream outage.
stale_ttl_secs = 30
# TTL for negative answers that carry no record TTL.
negative_ttl_secs = 30

[admission]
# Reject DNS ANY queries and malformed/overlong names at the policy edge.
reject_any = true
max_name_bytes = 253
# Bound records emitted by local and forwarded answers.
max_response_records = 64
# Bound the approximate DNS wire size of local and forwarded answers.
max_response_bytes = 4096
# Bound all policy requests, not only upstream exchanges.
max_inflight_requests = 1024
# Bound concurrent requests attributed to one client address.
max_inflight_per_client = 64

[security]
# Prevent forwarded answers from rebinding clients to private/local networks.
reject_private_upstream_addresses = true

[honeypot]
ipv4 = "192.0.2.1"
ipv6 = "2001:db8::1"
ttl = 60
