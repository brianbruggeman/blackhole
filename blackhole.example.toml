# Optional bounded background reload of policy-bearing configuration fields.
# Listener, transport, capture, storage, and process-capacity changes remain
# startup-only; zero disables polling.
reload_interval_secs = 0

[server]
# Use 53 only with the required OS capability; loopback keeps local testing scoped.
listen = "127.0.0.1:5353"

[dhcp]
# DHCP is opt-in and requires authorization to bind UDP port 67.
enabled = false
listen = "0.0.0.0:67"
server = "192.0.2.1"
subnet_mask = "255.255.255.0"
pool_start = "192.0.2.100"
pool_end = "192.0.2.199"
lease_secs = 3600
max_leases = 256

[admin]
# Optional authenticated HTTP control plane; keep it on loopback and protect
# this file because the bearer token is a credential.
# listen = "127.0.0.1:8081"
# token = "replace-with-a-long-random-token"

[capture]
# Capture is opt-in. Enabling it requires the platform's firewall capability.
enabled = false
inbound_port = 53
chain = "capture"
mark = 42
# The parent directory must already be owned and writable by the service.
ownership_path = "/var/lib/blackhole/capture.state"
# Used by the macOS PF adapter; set this to the host's inbound DNS address.
original_destination = "127.0.0.1:53"

[policy]
# ignore drops the DNS response, nxdomain denies it, honeypot returns the configured address.
mode = "nxdomain"
domains = ["ads.example", "telemetry.example"]
# With explicit rules, unmatched queries use this action. Pass and observe use
# the [upstream] section below when configured; forward is always explicit.
default_action = "pass"

# Optional Pi-hole/AdGuard-compatible hosts/domain lists. Entries become
# bounded generated apex and subdomain NXDOMAIN rules; basic @@||domain^
# exceptions and $denyallow=domain|domain exceptions are supported. Missing
# or malformed files fail startup.
blocklists = []
# Optional bounded allowlist; each domain includes its apex and subdomains.
# allowlist = ["updates.example"]
# Optional identity-scoped allowlists. The identity must be declared below;
# each domain includes its apex and subdomains for that client identity.
# [policy.allowlist_by_identity]
# family-router = ["updates.example"]
# Optional cancellable background reload interval; zero disables polling.
blocklist_reload_interval_secs = 0
# Optional group-scoped sources. A referenced source is removed from the
# unscoped list and applies only to enabled clients in the named group.
# [policy.blocklist_groups]
# family = ["/etc/blackhole/family-blocklist.txt"]

# Optional local DNS rewrites. A rewrite answers matching A/AAAA/CNAME/PTR/TXT queries
# when the selected policy action is pass or observe. Set exactly one record
# family; names may begin with '*.' for a one-label wildcard, and an explicit
# rule action wins.
[[policy.rewrites]]
name = "router.home.arpa"
ipv4 = "192.0.2.1"
ipv6 = "2001:db8::1"
# Optional transient identity scope; identity-scoped rewrites override global
# rewrites for that client while remaining bounded and non-retained.
# client_identity = "family-router"
ttl = 30

# Optional named service profile. Each domain becomes a policy rule; explicit
# rules with a higher effective precedence still win.
# A rule can instead use client_cidrs = ["192.0.2.0/24", "2001:db8::/32"]
# for a bounded multi-network client scope.
# Named groups can be reused by multiple profiles:
# [[policy.client_groups]]
# name = "family"
# client_cidrs = ["192.0.2.0/24", "2001:db8::/32"]
# Then set groups = ["family"] on a profile; do not combine groups with
# client_cidrs on that same profile.
# Optional Pi-hole-compatible conditional forwarding. A route without a
# domain handles PTR queries for its client CIDRs; a route with a domain sends
# all queries at that suffix. Targets must be named upstreams below.
# Routes are startup configuration and require a restart to change.
# [[policy.conditional_forwards]]
# client_cidrs = ["192.168.50.0/24"]
# upstream = "router"
# domain = "home.arpa"
# Optional exact-client identity labels for identity-scoped rules. Labels are
# transient and are not retained in telemetry or recording.
# [[policy.client_identities]]
# name = "family-router"
# statistics_enabled = true
# cache_enabled = true
# clients = ["192.0.2.10"]
# max_queries_per_second = 100  # optional per-client rate ceiling
# max_response_bytes_per_second = 65536  # optional encoded egress budget
# max_response_bytes_per_network_per_second = 262144  # optional network egress budget
# max_inflight_requests = 8  # optional concurrent request ceiling
# upstream = "family"  # selects a named upstream declared below
# Existing profiles can instead be assigned to identities while removing
# those profiles from the unscoped rule set:
# service_profiles_by_identity = { family-router = ["family-blocks"] }
[[policy.profiles]]
id = 40000
name = "telemetry"
domains = ["ads.example", "telemetry.example"]
action = "nxdomain"
priority = 10
# Optional exact client or bounded CIDR scope; do not configure both.
# client_cidrs = ["192.0.2.0/24", "2001:db8::/32"]
# Optional DNS filters; each is ranked independently with the client scope.
# qtype = 1
# qclass = 1
# qtypes = [1, 28]
# qclasses = [1, 3]

# Optional bounded regular-expression rule. Expressions match the normalized
# DNS name without its trailing root dot; explicit domain rules win first.
[[policy.regex_rules]]
id = 50000
pattern = "(^|\\.)tracking[0-9]*\\.example$"
action = "nxdomain"
priority = 10
# qtypes = [1, 28]
# qclasses = [1]

[upstream]
# IP literal only; no hostname lookup is performed.
resolver_ip = "1.1.1.1"
port = 53
# udp uses bounded TCP fallback on TC; tcp uses framed TCP for every query;
# tls uses DNS-over-TLS for every query; doh uses DNS-over-HTTPS; doq uses
# DNS-over-QUIC. All encrypted modes require tls_server_name. DoQ additionally
# requires building blackhole with --features doq.
transport = "udp"
# tls_server_name = "cloudflare-dns.com"
query_timeout_ms = 2000
# Retries are bounded to eight attempts per exchange.
max_attempts = 2
max_outstanding = 64
# Open the upstream circuit after this many consecutive failures.
breaker_failures = 3
# Keep the circuit open for this long before allowing a probe.
breaker_cooldown_secs = 30

# Optional named upstreams. An identity can select one with upstream = "name".
# Every named route uses the same bounded Proxima DNS exchange and transport
# validation as the default [upstream].
# [upstreams.family]
# resolver_ip = "9.9.9.9"
# port = 53
# transport = "udp"
# query_timeout_ms = 2000
# max_attempts = 2
# max_outstanding = 64
# breaker_failures = 3
# breaker_cooldown_secs = 30

[cache]
# Bound memory used by positive and negative upstream answers.
max_entries = 1024
# Never retain an answer beyond this protocol-TTL ceiling.
max_ttl_secs = 86400
# Permit cached answers to serve during a bounded upstream outage.
stale_ttl_secs = 30
# TTL for negative answers that carry no record TTL.
negative_ttl_secs = 30

[admission]
# Reject DNS ANY queries and malformed/overlong names at the policy edge.
reject_any = true
# Operator denylist checked before policy matching and rate accounting. Use
# /32 or /128 for one address; replacements are bounded and atomic.
deny_client_cidrs = []
max_name_bytes = 253
# Bound records emitted by local and forwarded answers.
max_response_records = 64
# Bound the approximate DNS wire size of local and forwarded answers.
max_response_bytes = 4096
# Also bound the response to four times the validated query's wire size.
max_response_amplification = 4
# Bound all policy requests, not only upstream exchanges.
max_inflight_requests = 1024
# Global queries-per-second ceiling; it also applies to unidentified callers.
max_queries_per_second = 10000
# Optional bounded CIDRs exempt only from the global query-rate ceiling.
# global_rate_limit_whitelist_cidrs = ["192.0.2.10/32"]
# Bound concurrent requests attributed to one client address.
max_inflight_per_client = 64
# Temporarily shed a client after repeated rate-limit or response-budget violations.
max_client_abuse_violations = 8
client_abuse_window_secs = 10
client_abuse_cooldown_secs = 30
# Temporarily shed an entire /24 (IPv4) or /64 (IPv6) after repeated
# violations from clients in that network; unrelated networks remain allowed.
max_network_abuse_violations = 32
network_abuse_window_secs = 10
network_abuse_cooldown_secs = 30
network_abuse_ipv4_prefix = 24
network_abuse_ipv6_prefix = 64

# Persist threshold crossings through the bounded Proxima JSONL recording
# sink. Requires privacy.query_recording_path to be configured.
[admission.ddos]
persist_incidents = false
# Set non-zero to shed all callers after repeated aggregate rate/egress
# violations. Zero disables the global abuse breaker.
max_global_abuse_violations = 0
global_abuse_window_secs = 10
global_abuse_cooldown_secs = 30
# Bound encoded DNS response bytes sent to one identified client per second.
max_response_bytes_per_client_per_second = 1048576
# Bound encoded DNS response bytes sent to one identified /24 or /64 network
# per second; the network prefix follows the abuse-breaker settings above.
max_response_bytes_per_network_per_second = 4194304

[security]
# Prevent forwarded answers from rebinding clients to private/local networks.
reject_private_upstream_addresses = true

[privacy]
# Query-decision logging is disabled by default. If enabled, only bounded
# timestamp/action/qtype/qclass metadata is retained; names and wire payloads
# are never recorded. The authenticated admin surface exposes GET /logs and
# POST /logs/clear.
query_log_enabled = false
# Set statistics_enabled = false on an identity to omit its actions from
# aggregate statistics without disabling policy or failure telemetry.
# Set cache_enabled = false on an identity to bypass bounded response caching
# for that client's requests.
query_log_max_entries = 1024
query_log_retention_secs = 86400
# Optional Proxima JSONL destination for the same metadata-only events.
# query_recording_path = "/var/lib/blackhole/query-decisions.jsonl"
# Hard encoded-byte ceiling for the destination (default: 64 MiB).
# query_recording_max_bytes = 67108864
# Opt-in startup rotation when the active file reaches its byte ceiling.
# Retains at most this many old files as .1, .2, ... (maximum: 16).
# query_recording_rotation_enabled = false
# query_recording_max_files = 3
# Retain either action/qtype/qclass metadata or only the action identity.
# query_recording_redaction = "metadata"
# Verify only exact generations, or also scan the parent directory for
# unexpected generations beyond the bounded .1 through .16 set.
# query_recording_verification = "exact_targets"

[country_policy]
# Optional local atomic recovery copy of the last verified map.
# last_good_path = "/var/lib/blackhole/country-map.last-good"
# Optional operator-supplied classification map. Each line is COUNTRY CIDR
# [REGION] [ASN], for example: US 192.0.2.0/24 US-CA AS64500.
# This may be a local file or an http(s) URL. No GeoIP database is bundled;
# hosted sources are bounded and file-age freshness applies only to local files.
# map_path = "/etc/blackhole/country-cidrs.txt"
# expected_sha256 = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
# max_age_secs = 86400
# reload_interval_secs = 3600
# deny_regions = ["US-CA"]
# observe_regions = ["CA-ON"]
# deny_asns = [64500]
# observe_asns = [64501]
# deny = ["CN", "RU"]
# observe = ["US"]

[honeypot]
ipv4 = "192.0.2.1"
ipv6 = "2001:db8::1"
ttl = 60
