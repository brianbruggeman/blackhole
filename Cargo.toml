[package]
name = "blackhole"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "A fast, policy-driven DNS sinkhole and honeypot built on Proxima"

[[bin]]
name = "blackhole"
path = "src/main.rs"
required-features = ["std"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["std"]
std = [
    "dep:bytes",
    "dep:conflaguration",
    "dep:futures",
    "dep:proxima",
    "dep:proxima-core",
    "dep:proxima-dns",
    "dep:proxima-listen",
    "dep:proxima-net",
    "dep:proxima-primitives",
    "dep:proxima-tls",
    "dep:regex",
    "dep:serde_json",
    "dep:toml",
    "proxima-protocols/std",
    "serde/std",
]
perf-instrument = ["std"]
# Compile the same sans-IO core with Proxima's optional Tokio capability
# available; Prime remains the default runtime and executable path.
tokio-compat = ["std", "proxima/tokio", "proxima-net/tokio"]
# DNS-over-QUIC uses Proxima's existing Quinn compatibility adapter.  It is
# opt-in because that adapter needs Tokio compatibility while the default
# listener remains Prime-only.
doq = [
    "tokio-compat",
    "dep:proxima-quic",
    "dep:rustls",
    "dep:webpki-roots",
    "proxima-quic/quinn-compat",
    "proxima-quic/tokio-compat",
]

[dependencies]
bytes = { version = "1", optional = true }
futures = { version = "0.3", optional = true }
proxima = { git = "https://github.com/brianbruggeman/proxima.git", rev = "03ea2c7d", default-features = false, features = ["dns-listener", "http1-native", "http-prime-deps", "serve-prime", "macros"], optional = true }
proxima-core = { git = "https://github.com/brianbruggeman/proxima.git", rev = "03ea2c7d", default-features = false, features = ["live", "std"], version = "0.1.0", optional = true }
proxima-dns = { git = "https://github.com/brianbruggeman/proxima.git", rev = "03ea2c7d", default-features = false, features = ["client", "doh", "listen"], version = "0.1.0", optional = true }
proxima-net = { git = "https://github.com/brianbruggeman/proxima.git", rev = "03ea2c7d", default-features = false, features = ["prime"], version = "0.1.0", optional = true }
proxima-listen = { git = "https://github.com/brianbruggeman/proxima.git", rev = "03ea2c7d", default-features = false, features = ["framed-any"], version = "0.1.0", optional = true }
proxima-primitives = { git = "https://github.com/brianbruggeman/proxima.git", rev = "03ea2c7d", default-features = false, features = ["alloc", "std", "atomic-permits"], optional = true }
proxima-tls = { git = "https://github.com/brianbruggeman/proxima.git", rev = "03ea2c7d", default-features = false, features = ["futures-io"], optional = true }
proxima-quic = { git = "https://github.com/brianbruggeman/proxima.git", rev = "03ea2c7d", default-features = false, features = ["quinn-compat", "tokio-compat"], version = "0.1.0", optional = true }
proxima-protocols = { git = "https://github.com/brianbruggeman/proxima.git", rev = "03ea2c7d", default-features = false, features = ["dns", "dns-codec-trait", "alloc"] }
regex = { version = "1", optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", optional = true }
toml = { version = "0.8", optional = true }
rustls = { version = "0.23.40", default-features = false, features = ["std", "aws_lc_rs", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }
conflaguration = { git = "https://github.com/brianbruggeman/conflaguration.git", rev = "3eb325d84fc291df35528e6781b5b814884e2d28", features = ["derive"], optional = true }

[dev-dependencies]
memchr = "2"
