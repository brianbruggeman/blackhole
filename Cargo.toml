[package]
name = "blackhole"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A fast, policy-driven DNS sinkhole and honeypot built on Proxima"

[dependencies]
proxima = { path = "../proxima", default-features = false, features = ["dns-listener", "serve-prime", "macros"] }
proxima-core = { path = "../proxima/proxima-core", default-features = false, features = ["live", "std"], version = "0.1.0" }
proxima-dns = { path = "../proxima/proxima-dns", default-features = false, features = ["client", "listen"], version = "0.1.0" }
proxima-primitives = { path = "../proxima/proxima-primitives", default-features = false, features = ["alloc", "std"] }
proxima-protocols = { path = "../proxima/proxima-protocols", default-features = false, features = ["dns", "alloc", "std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
